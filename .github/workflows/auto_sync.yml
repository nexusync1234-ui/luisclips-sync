name: Auto Sync Clippers (TikTok -> Neon DB & JSON)

on:
  schedule:
    # Runs automatically every 30 minutes 24/7 in the cloud
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: tiktok-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp and curl_cffi
        run: pip install --upgrade "yt-dlp[default]" curl_cffi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Sincronizacao dos Clippers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/sync_all.js

      - name: Commit and Push updated db.json
        run: |
          git config user.name "Luisclips AutoSync"
          git config user.email "actions@github.com"
          git add data/db.json
          git diff --staged --quiet || git commit -m "chore(sync): auto-update clippers views in db.json [skip ci]"
          git push
